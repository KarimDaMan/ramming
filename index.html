<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0d1117; color: #e6edf3;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
  .links { display: flex; flex-direction: column; gap: 0.75rem; align-items: stretch; }
  a.btn {
    display: block;
    background: #161b22;
    border: 1px solid #30363d;
    color: #58a6ff;
    padding: 1rem 1.25rem;
    border-radius: 8px;
    text-decoration: none;
    font-size: 1.1rem;
    word-break: break-all;
  }
  a.btn:hover { background: #1f242c; border-color: #58a6ff; }
  .muted { color: #8b949e; font-size: 0.9rem; margin-top: 1.5rem; }
</style>
</head>
<body>
  <main>
    <h1>Mirror</h1>
    <div class="links">
      <a class="btn" href="http://108.181.32.77/" target="_blank" rel="noopener">http://108.181.32.77/</a>
      <a class="btn" href="https://108.181.32.77/" target="_blank" rel="noopener">https://108.181.32.77/</a>
    </div>
    <p class="muted">Click a link above to open the mirror.</p>
  </main>
</body>
</html>
