<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d1117; color: #e6edf3;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #status { padding: 0.75rem 1rem; font-size: 0.9rem; border-bottom: 1px solid #30363d; }
  #status a { color: #58a6ff; }
  iframe { display: block; width: 100%; height: calc(100% - 44px); border: 0; background: #fff; }
  .err { color: #f85149; }
</style>
</head>
<body>
  <div id="status">Resolving DNS for 108.181.32.77...</div>
  <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>

<script>
const IP = '108.181.32.77';
const DOH = 'https://cloudflare-dns.com/dns-query';

function ipv4ToArpa(ip) {
  return ip.split('.').reverse().join('.') + '.in-addr.arpa';
}

async function doh(name, type) {
  const r = await fetch(`${DOH}?name=${encodeURIComponent(name)}&type=${type}`,
    { headers: { 'Accept': 'application/dns-json' } });
  if (!r.ok) throw new Error('DoH HTTP ' + r.status);
  return r.json();
}

(async () => {
  const status = document.getElementById('status');
  const frame = document.getElementById('frame');

  let host = IP;
  try {
    const res = await doh(ipv4ToArpa(IP), 'PTR');
    const names = (res.Answer || []).filter(a => a.type === 12).map(a => a.data.replace(/\.$/, ''));
    if (names.length) host = names[0];
  } catch (e) {
    status.innerHTML = `<span class="err">DNS lookup failed: ${e.message}</span>`;
  }

  const url = `https://${host}/`;
  status.innerHTML = `Hosting <strong>${host}</strong> &middot; <a href="${url}" target="_blank" rel="noopener">open directly</a> &middot; if it doesn't load, the target site blocks iframes (X-Frame-Options/CSP) — click "open directly".`;

  frame.src = url;
})();
</script>
</body>
</html>
